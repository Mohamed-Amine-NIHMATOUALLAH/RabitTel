spring.application.name=notification-service
server.port=8086

# ===========================
# Spring Cloud Config
# ===========================
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# ===========================
# Eureka Client
# ===========================
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ===========================
# Database (MySQL)
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/rabittel_notifications?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# MariaDB dialect — avoids the "5.5.5 version not supported" warning
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===========================
# Mail — Gmail SMTP
# ===========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=simo.horrovlog2004@gmail.com
spring.mail.password=dpvwtlcnmvovprli
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Adresse expéditeur
app.mail.from=simo.horrovlog2004@gmail.com
app.mail.from-name=RabitTel

# ===========================
# Thymeleaf
# ===========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===========================
# Swagger / OpenAPI
# ===========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===========================
# Logging — mail debug
# ===========================
logging.level.com.rabittel.notificationservice=DEBUG
logging.level.org.springframework.mail=DEBUG

# ===========================
# Actuator
# ===========================
management.endpoints.web.exposure.include=health,info
