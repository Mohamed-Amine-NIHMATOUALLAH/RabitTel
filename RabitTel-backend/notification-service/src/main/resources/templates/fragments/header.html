<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="header(title)">

    <table role="presentation"
           cellpadding="0"
           cellspacing="0"
           width="100%"
           style="
                background:#ffffff;
                border-bottom:1px solid #ececec;
           ">

        <tr>
            <td align="center" style="padding:35px 25px;">

                <!-- Logo -->

                <img
                        src="https://www.zonebourse.com/static/private-issuer-squared-9I42B.png"
                        alt="Attawfiq Microfinance"
                        width="90"
                        style="display:block;border:0;outline:none;text-decoration:none;">

                <div style="height:20px;"></div>

                <h1 style="
                    margin:0;
                    font-size:28px;
                    color:#7A3E00;
                    font-family:Segoe UI,Arial,sans-serif;
                    font-weight:700;
                ">
                    Attawfiq Microfinance
                </h1>

                <p style="
                    margin:8px 0 0;
                    color:#777777;
                    font-size:14px;
                    font-family:Segoe UI,Arial,sans-serif;
                ">
                    Groupe Banque Centrale Populaire
                </p>

                <div style="
                    width:80px;
                    height:4px;
                    background:#C58A2A;
                    margin:25px auto;
                    border-radius:30px;
                "></div>

                <h2 style="
                    margin:0;
                    color:#333333;
                    font-family:Segoe UI,Arial,sans-serif;
                    font-size:22px;
                    font-weight:600;
                "
                    th:text="${title}">
                    Notification
                </h2>

                <p style="
                    margin-top:8px;
                    color:#888888;
                    font-size:14px;
                    font-family:Segoe UI,Arial,sans-serif;
                ">
                    RabitTel Notification Service
                </p>

            </td>
        </tr>

    </table>

</th:block>

</html>
